<!doctype html>
<title>BarberPro Turnos</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#05080d;
    --bg-image:
      radial-gradient(ellipse 900px 640px at 20% -6%, rgba(41,182,246,.24), transparent 62%),
      radial-gradient(ellipse 780px 580px at 104% 8%, rgba(21,101,192,.22), transparent 58%),
      radial-gradient(ellipse 1000px 900px at 50% 62%, rgba(41,182,246,.13), transparent 66%),
      radial-gradient(ellipse 900px 700px at 50% 100%, rgba(21,101,192,.16), transparent 60%);
    --violet-1:#7cd4ff;
    --violet-2:#2196f3;
    --violet-glow:rgba(41,182,246,.4);
    --surface:#12181f;
    --surface-2:#1a222b;
    --surface-3:#232d38;
    --border:#2c3947;
    --border-soft:#1f2932;
    --text:#eef4f9;
    --text-muted:#a9b7c4;
    --text-faint:#7b8794;
    --accent-1:#29b6f6;
    --accent-2:#2196f3;
    --accent-3:#1565c0;
    --accent-grad:linear-gradient(120deg,var(--accent-1) 0%,var(--accent-2) 50%,var(--accent-3) 100%);
    --success:#4fae83;
    --success-bg:rgba(79,174,131,.14);
    --warn:#e8b23d;
    --warn-bg:rgba(232,178,61,.14);
    --danger:#ef4a5b;
    --danger-bg:rgba(239,74,91,.14);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-1:0 10px 30px -12px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* fondo fijado exacto a la pantalla (no depende de vh/dvh ni de lo alto que sea el contenido) */
  .backdrop{
    position:fixed; inset:0; z-index:-1;
    background-color:var(--bg);
    background-image:var(--bg-image);
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  .app{max-width:560px; margin:0 auto; padding:0 0 32px; position:relative;}

  /* ---------- hero ---------- */
  .hero{
    position:relative; width:100%; aspect-ratio:941/860; max-height:21vh; min-height:170px;
    overflow:hidden; background-color:var(--bg); background-image:var(--bg-image);
    background-size:cover; background-position:center;
  }
  .hero-photo{width:100%; height:100%; object-fit:contain; object-position:center; display:block;}
  .hero-scrim{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(5,4,7,.05) 0%, rgba(5,4,7,.25) 55%, var(--bg) 97%);
  }
  .hero-top-fade{position:absolute; inset:0 0 auto 0; height:35%; background:linear-gradient(180deg, rgba(5,4,7,.55), transparent); pointer-events:none;}
  .hero-content{position:absolute; left:20px; right:20px; bottom:10px;}
  .wordmark{
    font-family:'Anton',sans-serif;
    font-size:32px;
    line-height:.9;
    letter-spacing:.5px;
    background:var(--accent-grad);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0;
    filter:drop-shadow(0 3px 12px rgba(0,0,0,.7));
  }
  .tagline{color:var(--text-muted); font-size:12px; margin-top:2px; font-weight:600; letter-spacing:.2px; text-shadow:0 1px 8px rgba(0,0,0,.9);}
  .meta-row{display:flex; flex-wrap:wrap; gap:10px; padding:9px 20px 0;}
  .meta-chip{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-muted); font-weight:600;
    background:var(--surface); border:1px solid var(--border-soft);
    padding:5px 10px; border-radius:999px;
  }
  .meta-chip svg{width:13px;height:13px;flex:none;}

  /* ---------- role tabs ---------- */
  .roletabs{
    display:flex; gap:8px; margin:12px 20px 0; background:var(--surface);
    border:1px solid var(--border-soft); border-radius:999px; padding:5px;
  }
  .roletabs button{
    flex:1; border:none; background:transparent; color:var(--text-muted);
    font-family:inherit; font-weight:800; font-size:13px; letter-spacing:.3px;
    padding:9px 8px; border-radius:999px; cursor:pointer; text-transform:uppercase;
  }
  .roletabs button.active{background:var(--accent-grad); color:#ffffff; box-shadow:var(--shadow-1);}

  main{padding:14px 20px 20px;}
  .card{
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius-lg); padding:16px; margin-bottom:12px;
    box-shadow:var(--shadow-1);
  }
  .card h2{font-size:15px; font-weight:800; margin-bottom:3px;}
  .card .sub{color:var(--text-faint); font-size:12px; margin-bottom:12px; font-weight:600;}

  label{display:block; font-size:11.5px; font-weight:700; color:var(--text-muted); margin:0 0 5px; text-transform:uppercase; letter-spacing:.3px;}
  input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],select{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); font-family:inherit; font-size:15px; font-weight:600;
    padding:10px 13px; border-radius:var(--radius-sm); margin-bottom:10px;
  }
  input:focus,select:focus{outline:2px solid var(--accent-1); outline-offset:1px;}
  .field-hint{font-size:11px; color:var(--text-faint); margin-top:-6px; margin-bottom:10px; font-weight:600;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .checkline{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .checkline input[type=checkbox]{width:18px;height:18px; accent-color:var(--accent-2);}
  .checkline span{font-size:13.5px; font-weight:600; color:var(--text-muted);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:999px; font-family:inherit; font-weight:800;
    font-size:14.5px; letter-spacing:.2px; padding:11px 22px; cursor:pointer;
    width:100%;
  }
  .btn-primary{background:var(--accent-grad); color:#ffffff; box-shadow:var(--shadow-1);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-wa{background:#1fae58; color:#08210f;}
  .btn-danger{background:var(--danger-bg); color:var(--danger); border:1px solid rgba(239,74,91,.35);}
  .btn-sm{width:auto; padding:8px 14px; font-size:12.5px; border-radius:999px;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{width:auto; flex:1;}

  /* ---------- date strip ---------- */
  .date-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin:0 -4px 6px; scrollbar-width:thin;}
  .date-chip{
    flex:none; width:58px; text-align:center; padding:10px 0 9px; border-radius:14px;
    background:var(--surface-2); border:1px solid var(--border); cursor:pointer;
  }
  .date-chip .dow{font-size:10.5px; font-weight:800; color:var(--text-faint); text-transform:uppercase;}
  .date-chip .num{font-size:19px; font-weight:800; margin-top:2px;}
  .date-chip.selected{background:var(--accent-grad); border-color:transparent;}
  .date-chip.selected .dow,.date-chip.selected .num{color:#ffffff;}
  .date-chip.closed{opacity:.35; cursor:not-allowed;}

  .slot-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .slot-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    font-family:inherit; font-weight:700; font-size:14px; padding:11px 4px; border-radius:var(--radius-sm);
    cursor:pointer; font-variant-numeric:tabular-nums;
  }
  .slot-btn.selected{background:var(--accent-grad); color:#ffffff; border-color:transparent;}
  .slot-btn.taken{opacity:.4; cursor:not-allowed; text-decoration:line-through;}
  .slot-btn .taken-lbl{display:block; font-size:8px; font-weight:800; text-decoration:none; letter-spacing:.3px; margin-top:2px; color:var(--danger);}
  .empty-note{color:var(--text-faint); font-size:13px; font-weight:600; padding:14px 0; text-align:center;}

  .notice{
    display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; margin-bottom:14px; line-height:1.4;
  }
  .notice.warn{background:var(--warn-bg); color:var(--warn);}
  .notice.info{background:rgba(41,182,246,.12); color:var(--accent-1);}
  .notice svg{flex:none; width:16px; height:16px; margin-top:1px;}

  .summary-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:14px;}
  .summary-row:last-of-type{border-bottom:none;}
  .summary-row .k{color:var(--text-muted); font-weight:600;}
  .summary-row .v{font-weight:800; font-variant-numeric:tabular-nums;}
  .summary-row.total .v{color:var(--accent-1); font-size:17px;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.3px;}
  .badge.confirmed{background:var(--success-bg); color:var(--success);}
  .badge.cancelled{background:var(--danger-bg); color:var(--danger);}
  .badge.completed{background:var(--surface-3); color:var(--text-muted);}

  /* ---------- owner ---------- */
  .owner-nav-row{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .owner-nav-scroll{position:relative; flex:1; min-width:0;}
  .owner-nav-scroll::after{
    content:""; position:absolute; top:0; right:0; bottom:2px; width:26px;
    background:linear-gradient(90deg, transparent, rgba(7,6,10,.85) 70%);
    pointer-events:none;
  }
  .owner-nav{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
  .owner-nav button{
    flex:none; background:var(--surface); border:1px solid var(--border-soft); color:var(--text-muted);
    font-family:inherit; font-weight:700; font-size:12.5px; padding:9px 14px; border-radius:999px; cursor:pointer;
  }
  .owner-nav button.active{background:var(--surface-3); color:var(--text); border-color:var(--accent-2);}
  .btn-logout{
    flex:none; background:var(--surface); border:1px solid var(--border-soft); color:var(--text-muted);
    font-family:inherit; font-weight:700; font-size:12.5px; padding:9px 14px; border-radius:999px; cursor:pointer;
  }

  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .stat-tile{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:14px 16px;}
  .stat-tile .num{font-family:'Anton',sans-serif; font-size:28px; background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .stat-tile .lbl{font-size:11.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.3px; margin-top:2px;}

  .agenda-subnav{display:flex; gap:8px; margin-bottom:14px;}
  .agenda-subnav button{flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); font-family:inherit; font-weight:700; font-size:13px; padding:9px; border-radius:var(--radius-sm); cursor:pointer;}
  .agenda-subnav button.active{background:var(--surface-3); color:var(--text); border-color:var(--accent-2);}
  .nav-arrows{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .nav-arrows button{background:var(--surface-2); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:999px; cursor:pointer; font-size:16px; font-weight:800;}
  .nav-arrows .lbl{font-weight:800; font-size:14.5px; text-transform:capitalize;}

  .booking-row{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:10px;}
  .booking-row .top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;}
  .booking-row .time{font-family:'Anton',sans-serif; font-size:19px; letter-spacing:.3px;}
  .booking-row .name{font-weight:800; font-size:14.5px;}
  .booking-row .sub{font-size:12px; color:var(--text-faint); font-weight:600; margin-top:2px;}
  .booking-row .price{font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent-1); font-size:13.5px;}
  .booking-row .debt-tag{color:var(--warn); font-weight:700;}
  .booking-row .actions{display:flex; gap:8px; margin-top:10px;}

  .week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .week-col{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 5px; min-height:90px; cursor:pointer;}
  .week-col .dh{font-size:10px; font-weight:800; text-align:center; color:var(--text-faint); text-transform:uppercase;}
  .week-col .dn{font-size:15px; font-weight:800; text-align:center; margin:2px 0 6px;}
  .week-col.today{border-color:var(--accent-2);}
  .week-item{font-size:9.5px; font-weight:700; color:var(--text-muted); background:var(--surface-3); border-radius:5px; padding:2px 3px; margin-bottom:3px; text-align:center; font-variant-numeric:tabular-nums;}

  /* ---------- gantt (owner week view) ---------- */
  .gantt-outer{position:relative;}
  .gantt-outer::after{
    content:""; position:absolute; top:0; right:1px; bottom:0; width:30px; border-radius:0 var(--radius-md) var(--radius-md) 0;
    background:linear-gradient(90deg, transparent, var(--surface) 75%);
    pointer-events:none;
  }
  .gantt-wrap{overflow:auto; max-height:440px; border:1px solid var(--border-soft); border-radius:var(--radius-md); background:var(--surface);}
  .gantt-hint{font-size:11px; color:var(--text-faint); font-weight:700; text-align:center; margin-top:8px;}
  .gantt{display:flex; flex-direction:column; min-width:540px;}
  .gantt-row{display:grid; grid-template-columns:54px repeat(7,1fr);}
  .gantt-head{position:sticky; top:0; z-index:2; background:var(--surface-2); border-bottom:1px solid var(--border);}
  .gantt-time{font-size:9.5px; font-weight:700; color:var(--text-faint); padding:5px 6px; text-align:right; font-variant-numeric:tabular-nums; border-right:1px solid var(--border-soft); border-top:1px solid var(--border-soft);}
  .gantt-head .gantt-time{border-top:none;}
  .gantt-col-head{font-size:9.5px; font-weight:800; text-align:center; padding:8px 2px; color:var(--text-muted); text-transform:uppercase;}
  .gantt-col-head span{display:block; font-size:12px; margin-top:1px; font-weight:800;}
  .gantt-col-head.today{color:var(--accent-1);}
  .gantt-cell{min-height:24px; border-top:1px solid var(--border-soft); border-right:1px solid var(--border-soft); display:flex; align-items:center; justify-content:center; padding:1px;}
  .gantt-cell.closed{background:repeating-linear-gradient(45deg, var(--surface-2) 0 6px, var(--surface-3) 6px 12px); opacity:.55;}
  .gantt-cell.booked{background:var(--accent-grad); cursor:pointer;}
  .gantt-cell.today:not(.booked){background:rgba(41,182,246,.08);}
  .gantt-name{font-size:8px; font-weight:800; color:#ffffff; line-height:1.15; text-align:center; padding:0 2px;}
  .gantt-legend{display:flex; gap:14px; margin:10px 2px 4px; font-size:11px; color:var(--text-faint); font-weight:600;}
  .gantt-legend span{display:inline-flex; align-items:center; gap:5px;}
  .gantt-legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}

  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .month-dow{font-size:10px; font-weight:800; color:var(--text-faint); text-align:center; text-transform:uppercase; padding-bottom:4px;}
  .month-cell{aspect-ratio:1; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative;}
  .month-cell.other{opacity:.25; cursor:default;}
  .month-cell.closed{opacity:.35;}
  .month-cell.today{border-color:var(--accent-2);}
  .month-cell .dn{font-weight:800; font-size:14px;}
  .month-cell .dot{position:absolute; bottom:6px; width:6px; height:6px; border-radius:50%; background:var(--accent-1);}

  .hours-day{display:flex; flex-direction:column; gap:8px; padding:12px 0; border-bottom:1px solid var(--border-soft);}
  .hours-day:last-child{border-bottom:none;}
  .hours-day .dlabel{font-weight:800; font-size:14px; margin-bottom:2px;}
  .hours-shift{display:flex; align-items:center; gap:10px;}
  .hours-shift .shiftname{font-size:12px; font-weight:700; color:var(--text-faint); width:64px; flex:none;}
  .hours-shift input[type=checkbox]{width:17px;height:17px; accent-color:var(--accent-2); flex:none;}
  .hours-shift input[type=time]{background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:inherit; font-weight:700; padding:8px; border-radius:8px; width:100%;}
  .hours-shift.disabled input[type=time]{opacity:.35;}

  .closure-item{display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
  .closure-item .cd{font-weight:800; font-size:13.5px;}
  .closure-item .cr{font-size:12px; color:var(--text-faint); font-weight:600;}
  .closure-item button{background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer; line-height:1;}

  .debt-item{display:flex; justify-content:space-between; align-items:center; background:var(--warn-bg); border:1px solid rgba(232,178,61,.3); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .debt-item .n{font-weight:800; font-size:14px;}
  .debt-item .amt{font-weight:800; color:var(--warn); font-variant-numeric:tabular-nums;}

  .bell-wrap{position:relative; display:inline-flex;}
  .bell-dot{position:absolute; top:-3px; right:-3px; background:var(--danger); color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px;}

  .stepper{display:flex; gap:6px; margin-bottom:12px; padding:0 4px;}
  .stepper .dot{flex:1; height:4px; border-radius:99px; background:var(--surface-3);}
  .stepper .dot.done{background:var(--accent-grad);}

  .success-icon{width:56px; height:56px; border-radius:50%; background:var(--success-bg); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}

  .lockcard{text-align:center; padding:34px 20px;}
  .lockcard .lockicon{font-size:34px; margin-bottom:10px;}

  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--border); color:var(--text); font-weight:700; font-size:13.5px; padding:12px 18px; border-radius:999px; box-shadow:var(--shadow-1); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .modal-overlay{position:fixed; inset:0; background:rgba(8,7,9,.7); display:flex; align-items:center; justify-content:center; padding:24px; z-index:80; opacity:0; pointer-events:none; transition:opacity .18s;}
  .modal-overlay.show{opacity:1; pointer-events:auto;}
  .modal-box{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; max-width:340px; width:100%; box-shadow:var(--shadow-1); transform:translateY(6px); transition:transform .18s;}
  .modal-overlay.show .modal-box{transform:translateY(0);}
  .modal-box h3{font-size:16px; font-weight:800; margin-bottom:8px;}
  .modal-box p{font-size:13.5px; color:var(--text-muted); font-weight:600; line-height:1.5; margin:0 0 18px;}

  .footer-note{text-align:center; color:var(--text-faint); font-size:11px; font-weight:600; padding:18px 20px 0;}
  a{color:var(--accent-1);}
  ::-webkit-scrollbar{height:6px; width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}

  /* ---------- intro reveal ---------- */
  .intro-overlay{
    position:fixed; inset:0; z-index:300; overflow:hidden;
    background-color:var(--bg); background-image:var(--bg-image);
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .8s ease, visibility .8s;
  }
  .intro-overlay.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .intro-photo{
    width:min(78vw, 340px); height:min(78vw, 340px);
    object-fit:contain; display:block;
    opacity:0; transform:scale(.85);
    filter:drop-shadow(0 0 60px rgba(41,182,246,.5));
    animation:introIn 1.15s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes introIn{ 0%{opacity:0; transform:scale(.8);} 60%{opacity:1; transform:scale(1.05);} 100%{opacity:1; transform:scale(1);} }
  @media (prefers-reduced-motion: reduce){
    .intro-overlay{transition:none;}
    .intro-photo{animation:none; opacity:1; transform:none;}
  }

  .example-tag{display:inline-block; font-size:9px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; color:var(--violet-1); background:rgba(41,182,246,.16); border-radius:5px; padding:2px 6px; margin-left:6px; vertical-align:middle;}
</style>

<div class="backdrop"></div>
<div class="intro-overlay" id="introOverlay">
  <img class="intro-photo" src="barberpro-logo.png" alt="BarberPro">
</div>
<div class="app">
  <div class="hero">
    <img class="hero-photo" src="barberpro-logo.png" alt="BarberPro">
    <div class="hero-top-fade"></div>
    <div class="hero-scrim"></div>
    <div class="hero-content">
      <h1 class="wordmark" id="wordmarkText">MONTAL</h1>
      <div class="tagline" id="taglineText">Barbería · Reyna Montiel</div>
    </div>
  </div>
  <div class="meta-row">
    <span class="meta-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg><span id="addressText"></span></span>
    <a class="meta-chip" id="whatsAppHeaderLink" href="#" target="_blank" rel="noopener" style="text-decoration:none;">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm0 18.2a8.1 8.1 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.7.8-.8 1-.2.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5 0-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9 0 1.1.8 2.2.9 2.3.1.2 1.6 2.5 4 3.4.5.2 1 .4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.5-.6 1.6-1.1.2-.6.2-1 .1-1.1 0-.1-.2-.2-.4-.3Z"/></svg><span id="whatsAppDisplayText"></span></a>
  </div>

  <nav class="roletabs">
    <button id="tabCliente" class="active">Reservar turno</button>
    <button id="tabDueno">Panel del dueño</button>
  </nav>

  <main id="main"></main>

  <div class="footer-note"><span id="footerText"></span> · by JV Systems</div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="modalNo">Volver</button>
      <button class="btn btn-danger" id="modalYes" style="background:var(--accent-grad); color:#ffffff;">Confirmar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "montal_turnos_v4";
  var DOW_KEYS = ["sun","mon","tue","wed","thu","fri","sat"];
  var DOW_LABEL = {sun:"Domingo",mon:"Lunes",tue:"Martes",wed:"Miércoles",thu:"Jueves",fri:"Viernes",sat:"Sábado"};
  var DOW_SHORT = {sun:"DOM",mon:"LUN",tue:"MAR",wed:"MIÉ",thu:"JUE",fri:"VIE",sat:"SÁB"};
  var MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  function defaultHoursDay(morningActive, afternoonActive){
    return {
      morning:{active:morningActive, start:"09:00", end:"13:00"},
      afternoon:{active:afternoonActive, start:"16:00", end:"20:00"}
    };
  }

  function defaultState(){
    return {
      config:{
        businessName:"MONTAL",
        tagline:"Barbería · Reyna Montiel",
        address:"Pasaje Misiones 280",
        whatsappDisplay:"3436218436",
        whatsappLink:"5493436218436",
        price:8000,
        priceIsExample:true,
        slotMinutes:30,
        ownerPin:"1234",
        hours:{
          mon:defaultHoursDay(true,true), tue:defaultHoursDay(true,true), wed:defaultHoursDay(true,true),
          thu:defaultHoursDay(true,true), fri:defaultHoursDay(true,true),
          sat:defaultHoursDay(true,false), sun:defaultHoursDay(false,false)
        }
      },
      closures:[],
      bookings:[],
      debts:{}
    };
  }

  function seedExampleData(s){
    var d0 = toISO(new Date());
    var days = []; for(var i=0;i<7;i++) days.push(addDays(d0,i));

    function slotsFor(iso){
      var day = s.config.hours[DOW_KEYS[fromISO(iso).getDay()]];
      var ranges = [];
      if(day.morning.active) ranges.push(day.morning);
      if(day.afternoon.active) ranges.push(day.afternoon);
      var slotMin = s.config.slotMinutes, slots = [];
      ranges.forEach(function(r){
        var start=timeToMin(r.start), end=timeToMin(r.end);
        for(var t=start; t+slotMin<=end; t+=slotMin) slots.push(minToTime(t));
      });
      return slots;
    }
    function mk(name,lastname,phone,date,time){
      return {id:uid(), name:name, lastname:lastname, phone:phone||"", date:date, time:time,
        price:s.config.price, debtCharged:0, status:"confirmed", createdAt:Date.now(),
        seenByOwner:true, clientKey:clientKeyOf(name,lastname,phone), isExample:true};
    }

    var names = [
      ["Lucas","Gómez","3436111111"], ["Martina","Fernández","3436222222"], ["Ezequiel","Ríos",""],
      ["Brisa","Acosta","3436333333"], ["Tomás","Benítez",""], ["Camila","Torres","3436555555"],
      ["Nicolás","Herrera",""], ["Valentina","Cruz","3436666666"], ["Franco","Molina",""],
      ["Agustina","Paz","3436777777"], ["Bruno","Sosa",""], ["Micaela","Ortiz","3436888888"],
      ["Joaquín","Duarte",""], ["Delfina","Ibáñez","3436999999"], ["Mateo","Aguirre",""]
    ];
    var ni = 0;
    function nextName(){ var n = names[ni % names.length]; ni++; return n; }

    // hoy: un par de turnos sueltos entre horarios libres
    var d0Slots = slotsFor(days[0]);
    if(d0Slots.length){
      var a = nextName();
      s.bookings.push(mk(a[0],a[1],a[2], days[0], d0Slots[Math.min(1, d0Slots.length-1)]));
      if(d0Slots.length>4){ var a2=nextName(); s.bookings.push(mk(a2[0],a2[1],a2[2], days[0], d0Slots[d0Slots.length-2])); }
    }

    // para el resto de la semana, uso los días que realmente tengan horario abierto
    // (así el ejemplo "día completo" no cae justo en un domingo cerrado)
    var openRest = [];
    for(var j=1;j<7;j++){ if(slotsFor(days[j]).length) openRest.push(days[j]); }

    // el primer día abierto: bastante ocupado (3 de cada 4 horarios)
    if(openRest[0]){
      slotsFor(openRest[0]).forEach(function(time, idx){
        if(idx % 4 !== 0){ var n = nextName(); s.bookings.push(mk(n[0],n[1],n[2], openRest[0], time)); }
      });
    }
    // el segundo: día completo, sin ningún horario libre (para ver "no hay horarios disponibles")
    if(openRest[1]){
      slotsFor(openRest[1]).forEach(function(time){
        var n = nextName(); s.bookings.push(mk(n[0],n[1],n[2], openRest[1], time));
      });
    }
    // el tercero: a la mitad
    if(openRest[2]){
      slotsFor(openRest[2]).forEach(function(time, idx){
        if(idx % 2 === 0){ var n = nextName(); s.bookings.push(mk(n[0],n[1],n[2], openRest[2], time)); }
      });
    }
    // el cuarto: un solo turno
    if(openRest[3]){
      var s4 = slotsFor(openRest[3]);
      if(s4.length){ var n4 = nextName(); s.bookings.push(mk(n4[0],n4[1],n4[2], openRest[3], s4[0])); }
    }
    // el resto de los días abiertos quedan a propósito totalmente libres, para ver ese caso también

    // saldos pendientes de ejemplo
    var f1 = clientKeyOf("Facundo","Silva","3436444444");
    s.debts[f1] = {name:"Facundo", lastname:"Silva", phone:"3436444444", since:Date.now(), isExample:true};
    var f2 = clientKeyOf("Rocío","Navarro","");
    s.debts[f2] = {name:"Rocío", lastname:"Navarro", phone:"", since:Date.now(), isExample:true};
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){
        var fresh = defaultState();
        seedExampleData(fresh);
        return fresh;
      }
      var parsed = JSON.parse(raw);
      var d = defaultState();
      parsed.config = Object.assign({}, d.config, parsed.config||{});
      parsed.config.hours = Object.assign({}, d.config.hours, (parsed.config||{}).hours||{});
      parsed.closures = parsed.closures||[];
      parsed.bookings = parsed.bookings||[];
      parsed.debts = parsed.debts||{};
      return parsed;
    }catch(e){ return defaultState(); }
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = loadState();

  var session = {
    role: "cliente",
    ownerAuthed: (sessionStorage.getItem("montal_owner_authed")==="1"),
    ownerTab: "agenda",
    agendaView: "dia",
    agendaDate: toISO(new Date()),
    monthCursor: toISO(new Date()),
    weekCursor: toISO(new Date())
  };

  var client = {
    step:1,
    name:"", lastname:"", phone:"", remember:false,
    selectedDate:null, selectedTime:null,
    monthPicker:false,
    lastBooking:null
  };

  // ---------- intro reveal ----------
  (function(){
    var overlay = document.getElementById("introOverlay");
    if(!overlay) return;
    var seen = false;
    try{ seen = sessionStorage.getItem("montal_intro_seen")==="1"; }catch(e){}
    if(seen){
      overlay.style.display = "none";
    } else {
      setTimeout(function(){
        overlay.classList.add("hide");
        try{ sessionStorage.setItem("montal_intro_seen","1"); }catch(e){}
      }, 1200);
    }
  })();

  // ---------- utils ----------
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function pad2(n){ return n<10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function fromISO(iso){ var p=iso.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function addDays(iso,n){ var d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function addMonths(iso,n){ var d=fromISO(iso); d.setMonth(d.getMonth()+n); d.setDate(1); return toISO(d); }
  function weekdayKey(iso){ return DOW_KEYS[fromISO(iso).getDay()]; }
  function timeToMin(t){ var p=t.split(":").map(Number); return p[0]*60+p[1]; }
  function minToTime(m){ return pad2(Math.floor(m/60))+":"+pad2(m%60); }
  function money(n){ return "$" + Math.round(n).toLocaleString("es-AR"); }
  function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function formatDateLong(iso){
    var d = fromISO(iso);
    var wd = DOW_LABEL[DOW_KEYS[d.getDay()]];
    return wd + " " + d.getDate() + " de " + MONTHS[d.getMonth()];
  }
  function formatDateShort(iso){
    var d = fromISO(iso);
    return d.getDate() + " " + MONTHS[d.getMonth()].slice(0,3);
  }
  function normalize(s){ return (s||"").trim().toLowerCase().replace(/\s+/g," "); }
  function digitsOnly(s){ return (s||"").replace(/\D/g,""); }
  function clientKeyOf(name,lastname,phone){
    var ph = digitsOnly(phone);
    if(ph.length>=6) return "tel:"+ph;
    return "name:"+normalize(name+" "+lastname);
  }

  function askConfirm(title, message, onYes){
    var overlay = document.getElementById("modalOverlay");
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalMsg").textContent = message;
    overlay.classList.add("show");
    function cleanup(){ overlay.classList.remove("show"); yesBtn.onclick=null; noBtn.onclick=null; }
    var yesBtn = document.getElementById("modalYes");
    var noBtn = document.getElementById("modalNo");
    yesBtn.onclick = function(){ cleanup(); onYes(); };
    noBtn.onclick = function(){ cleanup(); };
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  // ---------- availability ----------
  function getClosure(iso){
    for(var i=0;i<state.closures.length;i++){ if(state.closures[i].date===iso) return state.closures[i]; }
    return null;
  }
  function getRangesForDate(iso){
    if(getClosure(iso)) return [];
    var day = state.config.hours[weekdayKey(iso)];
    var ranges = [];
    if(day.morning.active) ranges.push(day.morning);
    if(day.afternoon.active) ranges.push(day.afternoon);
    return ranges;
  }
  function isDayFullyClosed(iso){ return getRangesForDate(iso).length===0; }
  function generateSlots(iso){
    var ranges = getRangesForDate(iso);
    var slotMin = state.config.slotMinutes;
    var slots = [];
    ranges.forEach(function(r){
      var start=timeToMin(r.start), end=timeToMin(r.end);
      for(var t=start; t+slotMin<=end; t+=slotMin){ slots.push(minToTime(t)); }
    });
    var todayISO = toISO(new Date());
    if(iso===todayISO){
      var nowMin = new Date().getHours()*60+new Date().getMinutes();
      slots = slots.filter(function(s){ return timeToMin(s) > nowMin; });
    }
    var taken = state.bookings.filter(function(b){ return b.date===iso && b.status!=="cancelled"; }).map(function(b){ return b.time; });
    slots = slots.filter(function(s){ return taken.indexOf(s)===-1; });
    return slots;
  }
  function getSlotStatuses(iso){
    var ranges = getRangesForDate(iso);
    var slotMin = state.config.slotMinutes;
    var slots = [];
    ranges.forEach(function(r){
      var start=timeToMin(r.start), end=timeToMin(r.end);
      for(var t=start; t+slotMin<=end; t+=slotMin){ slots.push(minToTime(t)); }
    });
    var todayISO = toISO(new Date());
    if(iso===todayISO){
      var nowMin = new Date().getHours()*60+new Date().getMinutes();
      slots = slots.filter(function(s){ return timeToMin(s) > nowMin; });
    }
    var takenSet = {};
    state.bookings.filter(function(b){ return b.date===iso && b.status!=="cancelled"; }).forEach(function(b){ takenSet[b.time]=true; });
    return slots.map(function(s){ return {time:s, taken:!!takenSet[s]}; });
  }

  // ---------- booking ops ----------
  function activeDebtFor(key){ return state.debts[key] || null; }
  function currentPenalty(){ return Math.round(state.config.price/2); }

  function createBooking(){
    var key = clientKeyOf(client.name, client.lastname, client.phone);
    var hasDebt = !!activeDebtFor(key);
    var debtAmount = hasDebt ? currentPenalty() : 0;
    var booking = {
      id:uid(), name:client.name, lastname:client.lastname, phone:client.phone,
      date:client.selectedDate, time:client.selectedTime,
      price:state.config.price, debtCharged:debtAmount,
      status:"confirmed", createdAt:Date.now(), seenByOwner:false, clientKey:key
    };
    state.bookings.push(booking);
    if(hasDebt) delete state.debts[key];
    saveState();
    return booking;
  }

  function cancelBooking(id){
    var b = state.bookings.filter(function(x){ return x.id===id; })[0];
    if(!b) return;
    var todayISO = toISO(new Date());
    var penalized = (b.date===todayISO && b.status==="confirmed");
    if(penalized){
      state.debts[b.clientKey] = {name:b.name, lastname:b.lastname, phone:b.phone, since:Date.now()};
    }
    b.status = "cancelled";
    saveState();
    renderOwner();
    showToast(penalized ? "Turno cancelado. Se registró una seña pendiente (cancelación del mismo día)." : "Turno cancelado sin cargo.");
  }

  function completeBooking(id){
    var b = state.bookings.filter(function(x){ return x.id===id; })[0];
    if(!b) return;
    b.status = "completed";
    saveState();
    renderOwner();
  }

  function hasExampleData(){
    return state.bookings.some(function(b){ return b.isExample; }) ||
      Object.keys(state.debts).some(function(k){ return state.debts[k].isExample; });
  }
  function clearExampleData(){
    state.bookings = state.bookings.filter(function(b){ return !b.isExample; });
    Object.keys(state.debts).forEach(function(k){ if(state.debts[k].isExample) delete state.debts[k]; });
    saveState();
    renderOwner();
    showToast("Datos de ejemplo borrados.");
  }

  function settleDebt(key){
    delete state.debts[key];
    saveState();
    renderOwner();
    showToast("Saldo marcado como pagado.");
  }

  function buildWaLink(b){
    var total = b.price + (b.debtCharged||0);
    var msg = "Hola! Soy "+b.name+" "+b.lastname+". Reservé un turno en "+state.config.businessName+
      " para el "+formatDateLong(b.date)+" a las "+b.time+"hs. Total a abonar: "+money(total)+".";
    if(b.debtCharged>0) msg += " (incluye "+money(b.debtCharged)+" de una cancelación anterior).";
    msg += " ¡Gracias!";
    return "https://wa.me/"+state.config.whatsappLink+"?text="+encodeURIComponent(msg);
  }

  // ---------- render root ----------
  function render(){
    document.getElementById("tabCliente").classList.toggle("active", session.role==="cliente");
    document.getElementById("tabDueno").classList.toggle("active", session.role==="dueno");
    document.getElementById("whatsAppHeaderLink").href = "https://wa.me/"+state.config.whatsappLink;
    document.getElementById("whatsAppDisplayText").textContent = state.config.whatsappDisplay;
    document.getElementById("addressText").textContent = state.config.address;
    document.getElementById("wordmarkText").textContent = state.config.businessName;
    document.getElementById("taglineText").textContent = state.config.tagline;
    document.getElementById("footerText").textContent = state.config.businessName + " Turnos";
    document.title = state.config.businessName + " Turnos";
    if(session.role==="cliente") renderClient(); else renderOwner();
  }

  document.getElementById("tabCliente").onclick = function(){ session.role="cliente"; render(); };
  document.getElementById("tabDueno").onclick = function(){ session.role="dueno"; render(); };

  // ================= CLIENT VIEW =================
  function renderClient(){
    var main = document.getElementById("main");
    var html = "";
    html += '<div class="stepper">' +
      [1,2,3,4].map(function(n){ return '<div class="dot'+(client.step>=n?' done':'')+'"></div>'; }).join("") +
      '</div>';

    if(client.step===1) html += stepDatos();
    else if(client.step===2) html += stepFecha();
    else if(client.step===3) html += stepConfirmacion();
    else html += stepExito();

    main.innerHTML = html;
    bindClientEvents();
  }

  function stepDatos(){
    return '<div class="card">' +
      '<h2>Tus datos</h2>' +
      '<div class="sub">Para reservar tu turno en '+esc(state.config.businessName)+'</div>' +
      '<label>Nombre</label>' +
      '<input type="text" id="inpName" value="'+esc(client.name)+'" placeholder="Ej: Juan">' +
      '<label>Apellido</label>' +
      '<input type="text" id="inpLastname" value="'+esc(client.lastname)+'" placeholder="Ej: Pérez">' +
      '<label>WhatsApp (opcional, recomendado)</label>' +
      '<input type="tel" id="inpPhone" value="'+esc(client.phone)+'" placeholder="Ej: 3436 000000">' +
      '<div class="field-hint">Nos ayuda a identificarte si volvés y a avisarte cambios de turno.</div>' +
      '<div class="checkline"><input type="checkbox" id="inpRemember" '+(client.remember?'checked':'')+'><span>Recordar mis datos en este dispositivo</span></div>' +
      '<button class="btn btn-primary" id="btnStep1">Continuar</button>' +
      '</div>';
  }

  function stepFecha(){
    var days = [];
    for(var i=0;i<21;i++) days.push(addDays(toISO(new Date()), i));
    var strip = days.map(function(iso){
      var closed = isDayFullyClosed(iso);
      var d = fromISO(iso);
      var sel = client.selectedDate===iso ? " selected" : "";
      var cls = "date-chip" + sel + (closed?" closed":"");
      return '<div class="'+cls+'" data-date="'+iso+'"'+(closed?"":' data-pick="1"')+'>' +
        '<div class="dow">'+DOW_SHORT[DOW_KEYS[d.getDay()]]+'</div>' +
        '<div class="num">'+d.getDate()+'</div></div>';
    }).join("");

    var key = clientKeyOf(client.name, client.lastname, client.phone);
    var debt = activeDebtFor(key);
    var debtNotice = debt ? '<div class="notice warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><div>Tenés un saldo pendiente de '+money(currentPenalty())+' por una cancelación anterior. Se va a sumar a este turno.</div></div>' : "";

    var slotsHtml = "";
    if(client.selectedDate){
      var statuses = getSlotStatuses(client.selectedDate);
      if(statuses.length===0){
        slotsHtml = '<div class="empty-note">No hay horarios disponibles ese día. Probá con otra fecha.</div>';
      }else{
        slotsHtml = '<div class="slot-grid">' + statuses.map(function(st){
          if(st.taken){
            return '<button class="slot-btn taken" disabled>'+st.time+'<span class="taken-lbl">Ocupado</span></button>';
          }
          var sel = client.selectedTime===st.time ? " selected" : "";
          return '<button class="slot-btn'+sel+'" data-time="'+st.time+'">'+st.time+'</button>';
        }).join("") + '</div>';
      }
    }

    return '<div class="card">' +
      '<h2>Elegí fecha y horario</h2>' +
      '<div class="sub">Precio del corte: '+money(state.config.price)+'</div>' +
      debtNotice +
      '<div class="date-strip">'+strip+'</div>' +
      slotsHtml +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" id="btnBack1">Atrás</button>' +
        '<button class="btn btn-primary" id="btnStep2" '+(client.selectedDate&&client.selectedTime?'':'disabled')+'>Continuar</button>' +
      '</div>';
  }

  function stepConfirmacion(){
    var key = clientKeyOf(client.name, client.lastname, client.phone);
    var debt = activeDebtFor(key);
    var debtAmount = debt ? currentPenalty() : 0;
    var total = state.config.price + debtAmount;
    return '<div class="card">' +
      '<h2>Confirmá tu turno</h2>' +
      '<div class="sub">Revisá los datos antes de reservar</div>' +
      '<div class="summary-row"><span class="k">Cliente</span><span class="v">'+esc(client.name)+' '+esc(client.lastname)+'</span></div>' +
      '<div class="summary-row"><span class="k">Fecha</span><span class="v">'+formatDateLong(client.selectedDate)+'</span></div>' +
      '<div class="summary-row"><span class="k">Horario</span><span class="v">'+client.selectedTime+' hs</span></div>' +

  function agendaSemana(){
    var start = fromISO(session.weekCursor);
    var wd = start.getDay();
    var mondayOffset = (wd===0? -6 : 1-wd);
    start.setDate(start.getDate()+mondayOffset);
    var startISO = toISO(start);
    var todayISO = toISO(new Date());
    var days = [];
    for(var i=0;i<7;i++) days.push(addDays(startISO,i));

    var nav = '<div class="nav-arrows">' +
      '<button data-wnav="-1">‹</button>' +
      '<div class="lbl">'+formatDateShort(startISO)+' – '+formatDateShort(addDays(startISO,6))+'</div>' +
      '<button data-wnav="1">›</button>' +
      '</div>';

    // rango horario global: min inicio / max fin entre los turnos activos de la semana (o de la config si esa semana está toda cerrada)
    var minStart=null, maxEnd=null;
    days.forEach(function(iso){
      getRangesForDate(iso).forEach(function(r){
        var s=timeToMin(r.start), e=timeToMin(r.end);
        if(minStart===null||s<minStart) minStart=s;
        if(maxEnd===null||e>maxEnd) maxEnd=e;
      });
    });
    if(minStart===null){
      DOW_KEYS.forEach(function(k){
        ["morning","afternoon"].forEach(function(sh){
          var shift = state.config.hours[k][sh];
          if(shift.active){
            var s=timeToMin(shift.start), e=timeToMin(shift.end);
            if(minStart===null||s<minStart) minStart=s;
            if(maxEnd===null||e>maxEnd) maxEnd=e;
          }
        });
      });
    }
    if(minStart===null) return nav + '<div class="empty-note">No hay horarios configurados.</div>';

    var slotMin = state.config.slotMinutes;
    var rows = [];
    for(var t=minStart; t<maxEnd; t+=slotMin) rows.push(t);

    var head = '<div class="gantt-row gantt-head"><div class="gantt-time"></div>' +
      days.map(function(iso){
        var d = fromISO(iso);
        return '<div class="gantt-col-head'+(iso===todayISO?' today':'')+'">'+DOW_SHORT[DOW_KEYS[d.getDay()]]+'<span>'+d.getDate()+'</span></div>';
      }).join('') + '</div>';

    var body = rows.map(function(t){
      var timeLbl = minToTime(t);
      var row = '<div class="gantt-row"><div class="gantt-time">'+timeLbl+'</div>';
      days.forEach(function(iso){
        var open = getRangesForDate(iso).some(function(r){ return t>=timeToMin(r.start) && t<timeToMin(r.end); });
        var booking = state.bookings.filter(function(b){ return b.date===iso && b.time===timeLbl && b.status!=="cancelled"; })[0];
        var cls = "gantt-cell" + (open?"":" closed") + (booking?" booked":"") + (iso===todayISO?" today":"");
        var content = booking ? '<span class="gantt-name">'+esc(booking.name)+' '+esc((booking.lastname||"").charAt(0))+'.</span>' : "";
        row += '<div class="'+cls+'"'+(booking?' data-jump="'+iso+'" title="'+esc(booking.name)+' '+esc(booking.lastname)+' · '+timeLbl+'hs"':'')+'>'+content+'</div>';
      });
      return row + '</div>';
    }).join('');

    return nav +
      '<div class="gantt-outer"><div class="gantt-wrap"><div class="gantt">'+head+body+'</div></div></div>' +
      '<div class="gantt-hint">◀ Deslizá para ver los 7 días ▶</div>' +
      '<div class="gantt-legend">' +
        '<span><i style="background:var(--accent-grad)"></i>Ocupado</span>' +
        '<span><i style="background:var(--surface-2); border:1px solid var(--border);"></i>Libre</span>' +
        '<span><i style="background:var(--surface-3); opacity:.6;"></i>Cerrado</span>' +
      '</div>';
  }

  function agendaMes(){
    var cursor = fromISO(session.monthCursor);
    var year = cursor.getFullYear(), month = cursor.getMonth();
    var firstOfMonth = new Date(year,month,1);
    var startOffset = (firstOfMonth.getDay()===0? 6 : firstOfMonth.getDay()-1);
    var gridStart = new Date(year,month,1-startOffset);
    var todayISO = toISO(new Date());
    var cells = "";
    var dows = ["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"];
    dows.forEach(function(d){ cells += '<div class="month-dow">'+d+'</div>'; });
    for(var i=0;i<42;i++){
      var d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      var iso = toISO(d);
      var other = d.getMonth()!==month;
      var count = state.bookings.filter(function(b){ return b.date===iso && b.status!=="cancelled"; }).length;
      var closed = isDayFullyClosed(iso);
      cells += '<div class="month-cell'+(other?' other':'')+(closed&&!other?' closed':'')+(iso===todayISO?' today':'')+'" '+(other?'':'data-jump="'+iso+'"')+'>' +
        '<div class="dn">'+d.getDate()+'</div>' +
        (count && !other ? '<div class="dot"></div>' : '') +
        '</div>';
    }
    return '<div class="nav-arrows">' +
      '<button data-mnav="-1">‹</button>' +
      '<div class="lbl">'+MONTHS[month]+' '+year+'</div>' +
      '<button data-mnav="1">›</button>' +
      '</div>' +
      '<div class="month-grid">'+cells+'</div>';
  }

      var p = parseInt(document.getElementById("inpPrice").value,10);
      if(!isNaN(p) && p>0){ state.config.price = p; state.config.priceIsExample=false; }
      state.config.slotMinutes = parseInt(document.getElementById("inpSlotMin").value,10);
      saveState();
      renderOwner();
      showToast("Guardado.");
    };
    var btnPin = document.getElementById("btnSavePin");
    if(btnPin) btnPin.onclick = function(){
      var v = document.getElementById("inpNewPin").value.trim();
      if(v){ state.config.ownerPin = v; saveState(); showToast("PIN actualizado."); }
    };
  }

  function ownerSaldos(){
    var keys = Object.keys(state.debts);
    var html = '<div class="card"><h2>Clientes con saldo pendiente</h2><div class="sub">Cancelaciones del mismo día · se cobra el 50% del precio actual</div>';
    if(keys.length===0) html += '<div class="empty-note">No hay saldos pendientes.</div>';
    else html += keys.map(function(k){
      var d = state.debts[k];
      return '<div class="debt-item"><div><div class="n">'+esc(d.name)+' '+esc(d.lastname)+(d.isExample?'<span class="example-tag">Ejemplo</span>':'')+'</div>'+(d.phone?'<div class="cr" style="font-size:12px;color:var(--text-faint);">'+esc(d.phone)+'</div>':'')+'</div>' +
        '<div style="text-align:right;"><div class="amt">'+money(currentPenalty())+'</div>' +
        '<button class="btn btn-ghost btn-sm" style="margin-top:6px;" data-settle="'+k+'">Marcar pagado</button></div></div>';
    }).join("");
    html += '</div>';
    return html;
  }
  function bindSaldosEvents(){
    document.querySelectorAll("[data-settle]").forEach(function(el){
      el.onclick = function(){ settleDebt(el.getAttribute("data-settle")); };
    });
  }

  render();
})();
</script>
