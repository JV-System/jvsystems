<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Fiesta de la Virgen de Urkupiña · Gestión de devociones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;

  --manto:#5B4AA8; --manto-cl:#8E7DD9; --manto-pale:#E6E0F5;
  --niebla:#F4F1FA; --papel:#FFFFFF;
  --oro:#B8912B; --oro-cl:#E7D08A;
  --tinta:#2A2340; --tinta-suave:#6C6386;
  --rojo:#C0392B; --amarillo:#E4B429; --verde:#1E7B45;
}
*{box-sizing:border-box}
body{margin:0;background:var(--niebla);color:var(--tinta);
  font-family:"Outfit",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 70px}
/* ---- portada ---- */
.portada{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 25%,#6B58C0 0%,#4C3D93 48%,#2F2560 100%);
  transition:opacity .4s ease, visibility .4s}
.portada.fuera{opacity:0;visibility:hidden}
.portada-fondo{position:absolute;inset:0;
  background:radial-gradient(closest-side at 50% 38%,rgba(231,208,138,.22),transparent 70%)}
.portada-centro{position:relative;text-align:center;padding:0 22px;
  animation:subir .6s cubic-bezier(.2,.7,.3,1) both}
@keyframes subir{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.rayos{position:absolute;left:50%;top:38%;width:min(88vw,430px);height:min(88vw,430px);
  transform:translate(-50%,-50%);pointer-events:none;
  background:conic-gradient(from 0deg,rgba(231,208,138,.30) 0 3deg,transparent 3deg 15deg);
  -webkit-mask-image:radial-gradient(closest-side,transparent 34%,#000 46%,transparent 78%);
  mask-image:radial-gradient(closest-side,transparent 34%,#000 46%,transparent 78%);
  animation:girar 26s linear infinite}
@keyframes girar{to{transform:translate(-50%,-50%) rotate(360deg)}}
.nicho-grande{position:relative;width:min(56vw,220px);margin:0 auto 22px;border-radius:14px;
  overflow:hidden;border:4px solid var(--oro-cl);
  box-shadow:0 0 0 8px rgba(184,145,43,.22),0 0 60px rgba(231,208,138,.35),0 24px 50px -18px #000}
.nicho-grande img{display:block;width:100%}
.portada-eyebrow{margin:0 0 6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.28em;text-transform:uppercase;color:var(--oro-cl)}
.portada-titulo{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:900;color:#fff;
  font-size:clamp(30px,8vw,52px);line-height:1;letter-spacing:-.015em}
.portada-franja{width:112px;margin:18px auto 0}
.portada-firma{position:absolute;bottom:62px;margin:0;font-size:11px;letter-spacing:.1em;
  color:rgba(255,255,255,.55);text-align:center}
.portada-firma b{color:var(--oro-cl);font-weight:600;letter-spacing:.02em}
.portada-pie{position:absolute;bottom:34px;margin:0;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.55);animation:latir 2.2s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:.35}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){
  .rayos,.portada-pie{animation:none}
  .portada-centro{animation:none}
}
.franja{height:6px;border-radius:99px;display:block;
  background:linear-gradient(90deg,var(--rojo) 0 33.33%,var(--amarillo) 33.33% 66.66%,var(--verde) 66.66% 100%)}

/* ---- altar ---- */
.altar{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;
  background:radial-gradient(120% 140% at 12% 0%,#6B58C0 0%,#4C3D93 55%,#3B2F76 100%);
  border-radius:18px;padding:20px 26px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 18px 40px -24px rgba(59,47,118,.9)}
.altar::after{content:"";position:absolute;inset:-40% -10% auto auto;width:480px;height:480px;
  background:conic-gradient(from 0deg,rgba(231,208,138,.2) 0 6deg,transparent 6deg 18deg);
  border-radius:50%;pointer-events:none}
.nicho{width:126px;border-radius:10px;overflow:hidden;border:3px solid var(--oro-cl);
  box-shadow:0 0 0 5px rgba(184,145,43,.26),0 12px 26px -12px #000}
.nicho img{display:block;width:100%}
.titulos{position:relative;z-index:1;min-width:0}
h1{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:clamp(23px,3.6vw,38px);
  line-height:1.03;margin:0;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:400;color:var(--oro-cl);display:block;
  font-size:.55em;margin-top:6px;letter-spacing:0}
.altar .franja{width:100px;margin-top:12px}
.firma{position:relative;z-index:1;margin:0;align-self:end;text-align:right;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);
  line-height:1.7}
.firma b{display:block;font-family:"Fraunces",Georgia,serif;font-size:14px;font-weight:600;
  letter-spacing:.01em;text-transform:none;color:#fff}
.firma span{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.22em;color:var(--oro-cl)}

/* ---- pestañas tipo hoja ---- */
.hojas{display:flex;gap:3px;overflow-x:auto;margin:20px 0 0;padding:0 2px;
  scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.hoja{flex:none;border:1px solid var(--manto-pale);border-bottom:0;background:#EDE8F8;
  color:var(--tinta-suave);font:inherit;font-size:13.5px;padding:9px 15px 8px;
  border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px;
  display:inline-flex;align-items:center;gap:7px;transition:.15s}
.hoja:hover{background:#F6F3FD;color:var(--manto)}
.hoja i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  background:rgba(91,74,168,.12);border-radius:99px;padding:1px 6px}
.hoja[aria-selected="true"]{background:var(--papel);color:var(--manto);font-weight:600;
  border-color:var(--manto-pale);box-shadow:0 -3px 0 var(--oro) inset}
.hoja[aria-selected="true"] i{background:var(--manto-pale)}
.hoja.resumen{margin-left:auto}

/* ---- panel ---- */
.panel{background:var(--papel);border:1px solid var(--manto-pale);border-radius:0 14px 14px 14px;
  box-shadow:0 10px 30px -26px rgba(42,35,64,.8);overflow:hidden}
.barra-hoja{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:14px 16px;
  border-bottom:1px solid #F0EDF8;background:#FCFBFF}
.titulo-hoja{font-family:"Fraunces",serif;font-size:18px;font-weight:600;margin:0;flex:1 1 180px}
.titulo-hoja small{display:block;font-family:"Outfit",sans-serif;font-size:12px;
  font-weight:400;color:var(--tinta-suave)}
input[type=search],select,.btn{font:inherit;font-size:14px;border-radius:10px;
  border:1px solid var(--manto-pale);background:var(--papel);color:var(--tinta);padding:8px 12px}
input[type=search]{flex:1 1 200px;min-width:150px}
.btn{cursor:pointer;transition:.15s}.btn:hover{border-color:var(--manto-cl)}
.btn-oro{background:var(--manto);border-color:var(--manto);color:#fff;font-weight:500}
.btn-oro:hover{background:#4B3B96;border-color:#4B3B96}
:focus-visible{outline:2px solid var(--manto-cl);outline-offset:2px}

/* ---- tabla ---- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:520px}
table.ancha{min-width:640px}
table.recep-tabla{min-width:0}
table.compacta{min-width:0}
.btn-ver{font-weight:600;color:var(--manto);border-color:var(--manto-cl);white-space:nowrap}
.btn-ver.on{background:var(--manto);color:#fff;border-color:var(--manto)}
.txt[readonly]{cursor:default}
.txt[readonly]:hover{background:transparent;border-color:transparent}
.referencia{display:flex;flex-wrap:wrap;gap:14px;padding:9px 16px;background:#FCFBFF;
  border-bottom:1px solid var(--manto-pale);font-size:12px;color:var(--tinta-suave)}
.ref-item{display:inline-flex;align-items:center;gap:6px}
.pt{width:11px;height:11px;border-radius:4px;display:inline-block}
.pt.ok{background:var(--verde)}
.pt.debe{background:var(--rojo)}
.pt.pend{background:var(--amarillo)}
tr.f-debe td:first-child{box-shadow:inset 4px 0 0 var(--rojo)}
tr.f-pend td:first-child{box-shadow:inset 4px 0 0 var(--amarillo)}
tr.f-ok td:first-child{box-shadow:inset 4px 0 0 var(--verde)}
tr.f-debe .txt{color:#8E1F17}
.marca{flex:none;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  white-space:nowrap;letter-spacing:.01em}
.marca.debe{background:#FBE3E0;color:var(--rojo);font-family:"IBM Plex Mono",monospace}
.marca.pend{background:#FDF3D8;color:#8A6A0B}
.marca.ok{background:#DFF3E4;color:var(--verde)}
.celda-nombre{display:flex;align-items:center;gap:6px}
.celda-nombre .txt{flex:1;min-width:0}
.mas{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--manto-pale);
  background:#F6F4FC;color:var(--manto);font-size:20px;line-height:1;cursor:pointer;
  transition:transform .18s, background .15s}
.mas:hover{background:var(--manto-pale)}
.mas.girado{transform:rotate(90deg);background:#fff;color:var(--manto);border-color:#fff}
.mas.debe-pago{border-color:#F0C4BF;background:#FDF1F0;color:var(--rojo)}
tr.abierta td{background:var(--manto);border-color:var(--manto)}
tr.abierta .txt{color:#fff}
tr.abierta .idx{color:#D9D2F0;background:transparent}
tr.fila-det td{background:#F3F0FB;padding:0!important;border-top:0}
.ficha{margin:0 10px 12px;background:var(--papel);border:1px solid var(--manto-pale);
  border-radius:0 0 14px 14px;border-top:0;overflow:hidden;
  box-shadow:0 10px 22px -18px rgba(59,47,118,.75);animation:abrir .18s ease-out}
@keyframes abrir{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--manto-pale)}
.campo-f{display:flex;flex-direction:column;gap:5px;padding:11px 13px;background:var(--papel)}
.campo-f.ancho{grid-column:1/-1}
.lab-f{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave)}
.dato-f{font:inherit;font-size:14px;padding:8px 10px;border-radius:9px;
  border:1px solid var(--manto-pale);background:#FBFAFE;color:var(--tinta);width:100%}
.campo-f .num{width:100%;padding:8px;font-size:14px;background:#FBFAFE;border-color:var(--manto-pale)}
.valor-f{font-size:14.5px;font-weight:500;line-height:1.3}
.campo-f.fuerte .valor-f{color:var(--manto);font-size:17px;font-weight:600;
  font-family:"IBM Plex Mono",monospace}
.campo-f.rojo .valor-f{color:var(--rojo);font-weight:600}
.devos{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tag{font-size:11.5px;background:var(--manto-pale);color:var(--manto);
  padding:3px 9px;border-radius:99px;font-weight:500}
.ficha-pie{display:flex;align-items:center;gap:10px;padding:11px 13px;
  border-top:1px solid var(--manto-pale);background:#FCFBFF}
.ficha-pie .pill{flex:1}
.chip.grande{padding:7px 16px;font-size:13px}
.quitar{background:none;border:1px solid #F0D8D5;color:var(--rojo);border-radius:9px;
  padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.quitar:hover{background:#FBE3E0;border-color:var(--rojo)}
table.mini{min-width:560px}
tbody td,thead th,tfoot td{border:1px solid var(--manto-pale)}
thead th{background:#F8F6FD;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tinta-suave);text-align:left;padding:10px 14px;font-weight:600;
  border-bottom:1px solid var(--manto-pale);white-space:nowrap}
tbody td{padding:8px 14px;border-bottom:1px solid #F0EDF8;vertical-align:middle}
tbody tr:hover{background:#FAF8FE}
tfoot td{padding:11px 14px;background:#FBF7EA;border-top:2px solid var(--oro-cl);
  font-weight:600;font-family:"IBM Plex Mono",monospace;font-size:13px}
.idx{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--tinta-suave);
  width:38px;text-align:center;background:#FBFAFE}
.col-chk{width:58px;text-align:center;padding:6px!important}
.chk{width:40px;height:40px;border-radius:11px;border:2px solid var(--manto-pale);
  background:#fff;cursor:pointer;font-size:20px;line-height:1;color:#fff;transition:.12s}
.chk.si{background:var(--verde);border-color:var(--verde)}
.chk:active{transform:scale(.93)}
td.total{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px;
  font-weight:600;color:var(--manto);background:#FBFAFE}
tr.dentro td.total{color:var(--verde)}
.nombre{font-weight:500}
.devo,.obs{font-size:12px;color:var(--tinta-suave)}
.obs{font-style:italic;margin-top:2px}
.num{width:72px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px;
  border:1px solid transparent;border-radius:8px;padding:5px;background:#F6F4FC;color:var(--tinta)}
.num:hover{border-color:var(--manto-pale)}
.num.debe-alto{color:var(--rojo);font-weight:600}
.txt{width:100%;border:1px solid transparent;border-radius:8px;padding:5px 7px;
  font:inherit;font-size:14px;background:transparent;color:var(--tinta)}
.txt:hover,.txt:focus{background:#F6F4FC;border-color:var(--manto-pale)}
.pill{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;padding:5px 12px;
  border-radius:99px;transition:.15s}
.pill.si{background:#DFF3E4;color:var(--verde)}
.pill.no{background:#FBE3E0;color:var(--rojo)}
.pill:hover{filter:brightness(.96)}
.borrar{background:none;border:0;color:#C9C3DC;font-size:18px;cursor:pointer;padding:2px 6px;line-height:1}
.borrar:hover{color:var(--rojo)}
.vacio{padding:42px 20px;text-align:center;color:var(--tinta-suave)}
.vacio b{display:block;font-family:"Fraunces",serif;font-size:19px;color:var(--tinta);margin-bottom:4px}

/* ---- alta ---- */
.alta{display:none;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;
  background:#F8F5FF;border-bottom:1px solid var(--manto-pale)}
.alta.abierta{display:flex}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave)}
.campo input{font:inherit;font-size:14px;padding:8px 10px;border-radius:9px;
  border:1px solid var(--manto-pale);background:#fff}
.campo.ancho{flex:1 1 240px}.campo.ancho input{width:100%}

/* ---- tablero ---- */
.tablero{padding:18px 16px}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.cifra{border:1px solid var(--manto-pale);border-radius:12px;padding:13px 15px;background:#FCFBFF}
.cifra b{display:block;font-family:"IBM Plex Mono",monospace;font-size:clamp(19px,2vw,26px);
  font-weight:600;line-height:1.15;color:var(--manto);letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cifra.deuda b{font-size:clamp(16px,1.7vw,23px)}
.cifra span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tinta-suave);line-height:1.35;margin-top:2px}
.cifra.deuda b{color:var(--rojo)}
.avance{margin:18px 0 6px}
.riel{height:10px;border-radius:99px;background:var(--manto-pale);overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--verde),var(--amarillo));transition:width .5s}
.avance p{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--tinta-suave);margin:7px 0 0}
h2.sec{font-family:"Fraunces",serif;font-size:16px;margin:24px 0 10px;font-weight:600}
.mini{width:100%;border-collapse:collapse;font-size:14px}
.mini th,.mini td{border:1px solid var(--manto-pale)}
.mini th{background:#F8F6FD;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-suave);text-align:right;padding:8px 12px;font-weight:600}
.mini th:first-child{text-align:left}
.mini td{padding:8px 12px;border-bottom:1px solid #F0EDF8;text-align:right;
  font-family:"IBM Plex Mono",monospace;font-size:13px}
.mini td:first-child{text-align:left;font-family:"Outfit",sans-serif;font-weight:500}
.mini td.monto-primero{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600;
  color:var(--rojo);white-space:nowrap;background:#FDF4F3;width:1%}
.mini th.h-monto{text-align:right}
.mini th.h-txt{text-align:left}
.mini td.txt-izq{text-align:left;font-family:"Outfit",sans-serif;font-size:13.5px;font-weight:500}
.mini tr.click{cursor:pointer}.mini tr.click:hover{background:#FAF8FE}
.rojo{color:var(--rojo);font-weight:600}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;
  background:#DFF3E4;color:var(--verde);font-weight:600}
.chip.no{background:#FBE3E0;color:var(--rojo)}

.btn-rec{display:block;width:100%;margin-bottom:16px;padding:13px;font-size:15px;font-weight:600;
  background:linear-gradient(90deg,#1E7B45,#2F9A5C);border:0;color:#fff;border-radius:12px}
.btn-rec:hover{filter:brightness(1.06)}
.marcador{padding:16px 16px 4px}
.cifra.ok b{color:var(--verde)}
.pill.grande{padding:9px 16px;font-size:13px;min-width:132px}
tbody tr.dentro{background:#F1FAF3}
tbody tr.dentro:hover{background:#E8F6EC}
tbody tr.dentro .nombre{color:var(--verde)}
.hoja.recep[aria-selected="true"]{box-shadow:0 -3px 0 var(--verde) inset}
.llave{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 11px;border-radius:99px;background:#F0EDF8;color:var(--tinta-suave)}
.llave.abierta{background:#DFF3E4;color:var(--verde)}
.aviso-llave{margin:0;padding:26px 18px 30px;text-align:center;color:var(--tinta-suave);font-size:13.5px}
.aviso-llave b{display:block;font-family:"Fraunces",serif;font-size:18px;color:var(--tinta);margin-bottom:5px}
.nota{margin:0;padding:12px 16px;background:#FBF7EA;border-bottom:1px solid var(--manto-pale);
  font-size:13px;color:var(--tinta-suave)}
.error{flex:1 1 100%;margin:0;color:var(--rojo);font-size:13px}
.dias{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;padding:16px}
.dia{border:1px solid var(--manto-pale);border-radius:12px;overflow:hidden;background:#FCFBFF;
  display:flex;flex-direction:column}
.dia-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:11px 14px;background:var(--manto);color:#fff}
.dia-cab h3{margin:0;font-family:"Fraunces",serif;font-size:17px;font-weight:600}
.cuenta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--oro-cl)}
ul.tareas{list-style:none;margin:0;padding:6px 0;flex:1}
li.tarea{display:flex;gap:9px;align-items:flex-start;padding:8px 13px;border-bottom:1px solid #F0EDF8}
li.tarea:last-child{border-bottom:0}
li.tarea input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--verde);flex:none}
.tarea-cuerpo{flex:1;min-width:0;display:flex;flex-direction:column}
.tarea-txt{font-size:14px;line-height:1.35}
.tarea-meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--tinta-suave);margin-top:2px}
li.tarea.hecha .tarea-txt{text-decoration:line-through;color:var(--tinta-suave)}
li.sin{padding:14px 13px;font-size:13px;color:var(--tinta-suave);font-style:italic}
form.nueva{display:flex;flex-wrap:wrap;gap:6px;padding:11px 13px;border-top:1px solid var(--manto-pale);
  background:#F8F5FF}
form.nueva input{font:inherit;font-size:13.5px;padding:7px 9px;border-radius:8px;
  border:1px solid var(--manto-pale);background:#fff}
form.nueva .t-txt{flex:1 1 100%}
form.nueva .t-hora{width:78px}form.nueva .t-resp{flex:1 1 90px;min-width:80px}
form.nueva .btn{padding:7px 13px;font-size:13.5px}
.hoja.plan[aria-selected="true"]{box-shadow:0 -3px 0 var(--oro) inset}
.busca-todo{width:100%;font:inherit;font-size:14px;padding:11px 14px;border-radius:11px;
  border:1px solid var(--manto-pale);background:#FCFBFF;color:var(--tinta);margin-bottom:10px}
.resultados{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.resu{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--papel);border:1px solid var(--manto-pale);border-radius:10px;padding:9px 12px;font:inherit}
.resu:hover{border-color:var(--manto-cl);background:#FAF8FE}
.resu b{font-size:13.5px;font-weight:600;flex:1}
.resu-listas{font-size:11.5px;color:var(--tinta-suave)}
.sin-res{margin:0;font-size:13px;color:var(--tinta-suave)}
.mini td.celda-monto{text-align:right;white-space:nowrap;background:#FCFBFF;
  border-left:2px solid var(--manto-pale);border-right:2px solid var(--manto-pale)}
.monto-linea{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.monto-linea b{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600}
.monto-linea b.rojo{color:var(--rojo)}
.monto-linea b.cero{color:var(--tinta-suave)}
.monto-pie{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:4px}
.mini-riel{display:inline-block;vertical-align:middle;width:46px;height:6px;border-radius:99px;
  background:var(--manto-pale);overflow:hidden}
.mini-fill{height:100%;background:linear-gradient(90deg,#D9534F,var(--rojo))}
.peso-txt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--tinta-suave)}
.pie-nota{margin:8px 0 0;font-size:12px;color:var(--tinta-suave)}
.alerta{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:50%;background:var(--amarillo);color:#5B4406;font-weight:700;font-size:12px;
  margin-left:7px;vertical-align:middle;font-family:"Outfit",sans-serif;flex:none}
.alerta-nota{display:flex;align-items:flex-start;gap:2px;line-height:1.5;
  background:#FDF3D8;border:1px solid #F0DFAA;color:#7A5E08;border-radius:10px;padding:9px 12px;margin-top:9px}
.alerta-nota .alerta{margin-left:0;margin-top:1px}
.cifra.alerta-card{background:#FDF3D8;border-color:#F0DFAA}
.cifra.alerta-card b{color:#8A6A0B}
.pilares{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.pilar{display:inline-flex;align-items:center;gap:6px;background:#FBF7EA;border:1px solid var(--oro-cl);
  color:var(--tinta);border-radius:99px;padding:5px 11px;font-size:12.5px}
.pilar b{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--oro);color:#fff;
  border-radius:99px;padding:1px 7px}
.pilar-env{display:flex;flex-direction:column;gap:6px}
.pilar{cursor:pointer;font-family:inherit}
.pilar.on{background:var(--oro);border-color:var(--oro);color:#fff}
.pilar.on .estrella{color:#fff}
.pilar.on b{background:#fff;color:var(--oro)}
.pilar-det{display:flex;flex-direction:column;gap:5px;padding:9px 11px;background:#FCFBFF;
  border:1px solid var(--manto-pale);border-radius:11px}
.pilar-fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pilar-txt{font-size:12px;color:var(--tinta-suave)}
.estrella{font-style:normal;color:var(--oro)}
.estrella.chica{font-size:12px;margin-left:5px}
.monto-primero.alto{background:#F7DCD8;color:#8E1F17}
.cobrar{flex:1 1 100%;background:#FBE3E0;border-radius:10px;padding:10px 12px;font-size:12.5px;
  color:#8E1F17;line-height:1.45}
.cobrar b{display:block;font-family:"Fraunces",serif;font-size:16px;color:var(--rojo);margin-bottom:2px}
.cobrar{margin:0 13px 13px}
.cobrar-txt{display:block;margin-bottom:10px}
.btn-cobrado{width:100%;border:0;border-radius:10px;padding:12px;font:inherit;font-size:14px;
  font-weight:600;color:#fff;background:linear-gradient(90deg,#1E7B45,#2F9A5C);cursor:pointer;transition:.15s}
.btn-cobrado:hover{filter:brightness(1.06)}
.btn-cobrado:active{transform:scale(.99)}
.pie{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-size:12.5px;color:var(--tinta-suave)}
.pie .franja{width:56px;height:4px}
.guardado{font-family:"IBM Plex Mono",monospace;font-size:11.5px;display:inline-flex;
  align-items:center;gap:7px}
.guardado::before{content:"";width:8px;height:8px;border-radius:50%;background:#C9C3DC}
.guardado.ok::before{background:var(--verde)}
.guardado.off::before{background:var(--amarillo)}

@media (max-width:820px){
  .altar{grid-template-columns:auto 1fr;gap:14px;padding:14px 16px;align-items:center}
  .nicho{width:86px;border-width:2px}
  h1{font-size:20px;line-height:1.05}
  h1 em{font-size:.62em;margin-top:3px}
  .altar .franja{width:72px;height:5px;margin-top:9px}
  .firma{grid-column:1/-1;text-align:left;margin-top:10px;padding-top:9px;
    border-top:1px solid rgba(231,208,138,.2);font-size:9px;letter-spacing:.1em;line-height:1.4}
  .firma b{display:inline;font-size:11px}
  .firma span{display:inline;font-size:9px;letter-spacing:.14em}
  .firma b::before{content:" "}
  .firma span::before{content:" · "}
  .hoja.resumen{margin-left:0}
  .wrap{padding:12px 10px 60px}
  .panel{border-radius:0 12px 12px 12px}
  .barra-hoja{padding:11px 12px;gap:7px}
  .titulo-hoja{font-size:16px}
  tbody td,thead th{padding:6px 8px;font-size:13px}
  thead th{font-size:9.5px;letter-spacing:.06em}
  .txt{font-size:13px;padding:4px 5px}
  .num{width:54px;font-size:12.5px;padding:4px}
  .idx{width:30px;font-size:11.5px}
  .pill{font-size:11.5px;padding:5px 9px}
  .devo{font-size:11.5px}
  .tablero,.marcador{padding:13px 12px}
  .cifras{grid-template-columns:repeat(2,1fr);gap:8px}
  .cifra{padding:10px 12px}.cifra b{font-size:22px}
  .dias{padding:12px;gap:11px}
  tfoot td{font-size:11.5px;padding:9px 12px;line-height:1.5}
  .hoja{font-size:13px;padding:8px 12px 7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

BASE.forEach(d => { const k = d.lista+"|"+(d.detalle||"");
  if(ORDEN_CAT[k] === undefined) ORDEN_CAT[k] = Object.keys(ORDEN_CAT).length; });
function ordenar(){
  datos.sort((a,b) => {
    const dl = (ORDEN_LISTA[a.lista] ?? 99) - (ORDEN_LISTA[b.lista] ?? 99);
    if(dl) return dl;
    if(conDetalle(a.lista)){
      const dc = (ORDEN_CAT[a.lista+"|"+(a.detalle||"")] ?? 999) - (ORDEN_CAT[b.lista+"|"+(b.detalle||"")] ?? 999);
      if(dc) return dc;
    }
    return a.nombre.localeCompare(b.nombre, "es", {sensitivity:"base"});
  });
}
const adultos = d => (d.adultos != null ? +d.adultos : adultosDe(d.nombre));
const pos = d => datos.filter(o=>o.lista===d.lista).indexOf(d) + 1;
const conDetalle = l => l === "BAILARINES" || l === "OTRAS DEVOCIONES";
const etiqueta = d => (ROTULO[d.lista]||d.lista) + " N° " + pos(d) + (d.detalle ? " · " + d.detalle : "");
const plata = n => "$" + (+n||0).toLocaleString("es-AR");
const aviso = t => $("#guardado").textContent = t;

/* --- respaldo local --- */
function leerLocal(){ try{ return localStorage.getItem(CLAVE); }catch(e){ return null; } }
function escribirLocal(){ try{ localStorage.setItem(CLAVE, JSON.stringify({datos, ingresos, tareas})); }catch(e){} }

/* --- volcado desde la nube --- */
function aplicarDevociones(obj){
  const arr = Object.values(obj || {});
  if(!arr.length) return false;
  const antes = JSON.stringify(datos);
  datos = arr;
  ordenar();
  if(JSON.stringify(datos) === antes) return false;
  return true;
}

async function cargar(){
  // 1) arranca con lo que haya guardado en el teléfono, para que se vea al toque
  try{
    const bruto = leerLocal();
    if(bruto){
      const g = JSON.parse(bruto);
      if(g.datos && g.datos.length) datos = g.datos;
      ingresos = g.ingresos || {};
      if(g.tareas) tareas = Object.assign(tareas, g.tareas);
    }
  }catch(e){}

  // 2) se engancha a Firebase
  try{
    if(typeof firebase === "undefined") throw new Error("sin sdk");
    firebase.initializeApp(FB);
    db = firebase.database();

    const snap = await db.ref(RUTA + "/devociones").get();
    if(!snap.exists()){
      // primera vez: siembra la planilla
      const semilla = {};
      BASE.forEach(d => semilla[d.id] = d);
      await db.ref(RUTA + "/devociones").set(semilla);
    }
    nube = true;

    db.ref(".info/connected").on("value", s2 => {
      if(s2.val()) aviso2("Conectado · se comparte con todos", "ok");
      else aviso2("Sin conexión · se sincroniza al volver", "off");
    });
    db.ref(RUTA + "/devociones").on("value", s2 => {
      if(aplicarDevociones(s2.val())){ escribirLocal(); if(typeof pintar === "function") pintar(); }
    });
    db.ref(RUTA + "/ingresos").on("value", s2 => {
      const v = s2.val() || {};
      const nuevos = {};
      Object.keys(v).forEach(k => { if(v[k] && v[k].nombre) nuevos[v[k].nombre] = true; });
      if(JSON.stringify(nuevos) !== JSON.stringify(ingresos)){
        ingresos = nuevos; escribirLocal(); if(typeof pintar === "function") pintar();
      }
    });
    db.ref(RUTA + "/tareas").on("value", s2 => {
      const v = s2.val() || {};
      const nuevas = {jueves:[],viernes:[],sabado:[],domingo:[]};
      DIAS.forEach(([k]) => nuevas[k] = Object.values(v[k] || {}));
      if(JSON.stringify(nuevas) !== JSON.stringify(tareas)){
        tareas = nuevas; escribirLocal(); if(typeof pintar === "function") pintar();
      }
    });
  }catch(e){
    nube = false;
    aviso2("Sin conexión · guardado en este teléfono", "off");
  }
}

/* --- escrituras --- */
function guardarDev(d){
  escribirLocal();
  if(!d.id) d.id = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  if(nube) db.ref(RUTA + "/devociones/" + d.id).set(d).catch(()=>{});
}
function borrarDev(d){
  escribirLocal();
  if(nube && d.id) db.ref(RUTA + "/devociones/" + d.id).remove().catch(()=>{});
}
function guardarIngreso(nombre, entra){
  escribirLocal();
  if(!nube) return;
  const r = db.ref(RUTA + "/ingresos/" + llave(nombre));
  if(entra) r.set({nombre, hora: Date.now()}).catch(()=>{});
  else r.remove().catch(()=>{});
}
function guardarIngresos(){
  escribirLocal();
  if(nube) db.ref(RUTA + "/ingresos").remove().catch(()=>{});
}
function guardarTareas(){
  escribirLocal();
  if(!nube) return;
  const v = {};
  DIAS.forEach(([k]) => { v[k] = {}; tareas[k].forEach((t,i) => v[k]["t"+i] = t); });
  db.ref(RUTA + "/tareas").set(v).catch(()=>{});
}
function guardar(){ escribirLocal(); }

/* ---------- pestañas ---------- */
function pintarHojas(){
  const c = $("#hojas"); c.innerHTML = "";
  const armar = (id, rot, n, extra) => {
    const b = el("button","hoja" + (extra?" "+extra:""));
    b.type = "button"; b.role = "tab";
    b.setAttribute("aria-selected", hoja === id);
    b.append(rot);
    if(n !== null) b.append(el("i","",n));
    b.onclick = () => { hoja = id; texto = ""; estado = "todos"; altaAbierta = false; pintar(); };
    c.appendChild(b);
  };
  armar("TABLERO","Tablero",null);
  LISTAS.forEach(l => armar(l, ROTULO[l], datos.filter(d=>d.lista===l).length));
  armar("RESUMEN","Resumen por persona", new Set(datos.map(d=>d.nombre)).size, "resumen");
  armar("PLANIFICACION","Planificación", DIAS.reduce((a,[k])=>a+tareas[k].length,0), "plan");
  armar("RECEPCION","Recepción", nombres().length, "recep");
}

  cont.append(g);

  const pct = datos.length ? Math.round(pagadas/datos.length*100) : 0;
  const av = el("div","avance");

      const p1 = Math.round(dd/debe*100);

        const mas = el("button","mas"); mas.type = "button";
        mas.innerHTML = "&rsaquo;";
        mas.setAttribute("aria-label","Ver los datos de "+d.nombre);
        if(d.pagado !== "SI") mas.classList.add("debe-pago");
        td1.append(mas);
        tr.append(td1);
        tb.append(tr);

        const det = el("tr","fila-det"); det.hidden = true;
        const tdd = el("td"); tdd.colSpan = mostrarDev ? 4 : 3;
        const ficha = el("div","ficha");
        const rej = el("div","rejilla");
        if(conD && !mostrarDev){
          const c = el("label","campo-f ancho");
          c.append(el("span","lab-f","Devoción"));
          const iT = document.createElement("input");
          iT.className = "dato-f"; iT.value = d.detalle || "";
          iT.onchange = () => { d.detalle = iT.value.trim(); guardarDev(d); };
          c.append(iT); rej.append(c);
        }
        const cA = el("label","campo-f");
        const iA = document.createElement("input");
        iA.type="number"; iA.min="1"; iA.className="num"; iA.value = adultos(d);
        iA.setAttribute("aria-label","Adultos de "+d.nombre);
        iA.onchange = () => { d.adultos = Math.max(1, +iA.value||1); iA.value = d.adultos; pintarTotales(); guardarDev(d); };
        cA.append(el("span","lab-f","Adultos"), iA);
        const cM = el("label","campo-f");
        cM.append(el("span","lab-f","Menores"), campoNum(d,"menores","Menores",false));
        const cD = el("label","campo-f");
        cD.append(el("span","lab-f","Debe ($)"), campoNum(d,"debe","Debe",true));
        rej.append(cA, cM, cD);
        ficha.append(rej);
        const pie = el("div","ficha-pie");
        pie.append(botonPago(d,false), botonBorrar(d));
        ficha.append(pie);
        tdd.append(ficha); det.append(tdd); tb.append(det);

        mas.onclick = () => {
          det.hidden = !det.hidden;
          mas.classList.toggle("girado", !det.hidden);
          tr.classList.toggle("abierta", !det.hidden);
        };
        return;
      }

      tr.append(td1);
      if(conD){
        const td2 = el("td");
        const iT = document.createElement("input");
        iT.className="txt"; iT.value = d.detalle || ""; iT.setAttribute("aria-label","Devoción");
        iT.onchange = () => { d.detalle = iT.value.trim(); guardarDev(d); };
        td2.append(iT); tr.append(td2);
      }
      const tdM = el("td"); tdM.style.textAlign="center"; tdM.append(campoNum(d,"menores","Menores",false));
      const tdD = el("td"); tdD.style.textAlign="center"; tdD.append(campoNum(d,"debe","Debe",true));
      const tdP = el("td"); tdP.style.textAlign="center"; tdP.append(botonPago(d,true));
      const tdX = el("td"); tdX.style.textAlign="right";
      tr.append(tdM, tdD, tdP, tdX);  // vista ancha (no se usa)
      tb.append(tr);
    });

    t.append(tb);
    const tf = el("tfoot"); tf.innerHTML = '<tr><td colspan="'+(mostrarDev?4:3)+'" id="tot"></td></tr>';
    t.append(tf);
    const sc = el("div","scroll"); sc.append(t); caja.append(sc);
    pintarTotales();
  }

  function pintarTotales(){
    const tot = caja.querySelector("#tot"); if(!tot) return;
    const f = datos.filter(d => d.lista === lista);
    const pg = f.filter(d=>d.pagado==="SI").length;
    const men = f.reduce((a,d)=>a+(+d.menores||0),0);
    const deb = f.reduce((a,d)=>a+(+d.debe||0),0);
    const per = f.reduce((a,d)=>a+adultos(d)+(+d.menores||0),0);
    const sinM = f.filter(x => x.pagado !== "SI" && !(+x.debe > 0)).length;
    tot.textContent = f.length + " devotos · " + per + " personas · " + men + " menores · " + pg + " pagados · "
      + (f.length-pg) + " pendientes · por cobrar " + plata(deb)
      + (sinM ? "  ⚠ " + sinM + " sin monto" : "");
  }
}

/* ---------- resumen ---------- */
function vistaResumen(p){
  const barra = el("div","barra-hoja");
  const tit = el("div","titulo-hoja");
  tit.append("Resumen por persona", el("small","","Qué cumple cada devoto, cuánto debe y si está al día"));
  barra.append(tit);
  const busc = document.createElement("input");
  busc.type="search"; busc.placeholder="Buscar devoto…"; busc.value = texto;
  busc.oninput = e => { texto = e.target.value; caja.innerHTML=""; tabla(); };
  barra.append(busc);
  p.append(barra);
  const caja = el("div"); p.append(caja);
  tabla();

  function tabla(){
    const mapa = new Map();
    datos.forEach(d=>{
      if(!mapa.has(d.nombre)) mapa.set(d.nombre, []);
      mapa.get(d.nombre).push(d);
    });
    const t = texto.trim().toLowerCase();
    const filas = [...mapa.entries()].filter(([n]) => !t || n.toLowerCase().includes(t)).sort();
    if(!filas.length){
      const v = el("div","vacio");
      v.append(el("b","","Sin resultados"), document.createTextNode("Probá con otro nombre."));
      caja.append(v); return;
    }
    const tb = el("table");
    tb.className = abierto ? "ancha" : "compacta";
    tb.innerHTML = '<thead><tr><th>Devoto</th>'
      + (abierto ? '<th>Devociones que cumple</th><th style="text-align:center">Menores</th>'
                 + '<th style="text-align:center">Debe</th><th style="text-align:center">Estado</th>' : '')
      + '</tr></thead>';
    const body = el("tbody");
    filas.forEach(([nombre, fs])=>{
      const deb = fs.reduce((a,d)=>a+(+d.debe||0),0);
      const men = fs.reduce((a,d)=>a+(+d.menores||0),0);
      const adu = Math.max(...fs.map(adultos));
      const pend = fs.filter(d=>d.pagado!=="SI").length;
      const tr = el("tr");
      tr.append(el("td","nombre",nombre));
      if(abierto){
        tr.append(el("td","devo", fs.map(etiqueta).join("   ·   ")));
        const tdM = el("td","",men); tdM.style.textAlign="center"; tdM.style.fontFamily='"IBM Plex Mono",monospace';
        tr.append(tdM);
        const tdD = el("td", deb>0?"rojo":"", plata(deb)); tdD.style.textAlign="center";
        tdD.style.fontFamily='"IBM Plex Mono",monospace'; tr.append(tdD);
      }
      if(abierto){
        const tdE = el("td"); tdE.style.textAlign="center";
        tdE.append(el("span","chip"+(deb===0&&pend===0?"":" no"), deb===0&&pend===0?"Al día":"Pendiente"));
        tr.append(tdE);
        body.append(tr);
        return;
      }
      const tdN = tr.firstChild; tdN.classList.add("celda-nombre");
      const mas = el("button","mas"); mas.type="button"; mas.innerHTML="&rsaquo;";
      mas.setAttribute("aria-label","Ver los datos de "+nombre);
      tdN.append(mas);
      body.append(tr);
      const det = el("tr","fila-det"); det.hidden = true;
      const tdd = el("td"); tdd.colSpan = 2;
      const ficha = el("div","ficha");
      const rej = el("div","rejilla");
      const bloque = (et, v, cls) => { const c = el("div","campo-f"+(cls?" "+cls:""));
        c.append(el("span","lab-f",et), el("b","valor-f",v)); return c; };
      const cDev = el("div","campo-f ancho");
      cDev.append(el("span","lab-f","Devociones que cumple"));
      const ul = el("div","devos");
      fs.forEach(x => ul.append(el("span","tag", etiqueta(x))));
      cDev.append(ul);
      rej.append(cDev, bloque("Adultos", adu), bloque("Menores", men),
                 bloque("Personas", adu + men, "fuerte"), bloque("Debe", plata(deb), deb>0?"rojo":""));
      ficha.append(rej);
      const pie = el("div","ficha-pie");
      pie.append(el("span","chip grande"+(deb===0&&pend===0?"":" no"), deb===0&&pend===0?"Al día":"Pendiente"));
      ficha.append(pie);
      tdd.append(ficha); det.append(tdd); body.append(det);
      mas.onclick = () => {
        det.hidden = !det.hidden;
        mas.classList.toggle("girado", !det.hidden);
        tr.classList.toggle("abierta", !det.hidden);
      };
    });
    tb.append(body);
    const tf = el("tfoot");
    const deb = datos.reduce((a,d)=>a+(+d.debe||0),0);
    tf.innerHTML = '<tr><td colspan="'+(abierto?5:1)+'">'+filas.length+' devotos · por cobrar '+plata(deb)+'</td></tr>';
    tb.append(tf);
    const sc = el("div","scroll"); sc.append(tb); caja.append(sc);
  }
}

/* ---------- acceso ---------- */
function panelAcceso(p, usuario, clave, alEntrar){
  const f = el("form","alta"); f.id = "acceso";
  f.innerHTML = '<div class="campo"><label for="u">Usuario</label><input id="u" autocomplete="username"></div>'
    + '<div class="campo"><label for="c">Contraseña</label><input id="c" type="password" autocomplete="current-password"></div>'
    + '<button class="btn btn-oro" type="submit">Entrar</button>'
    + '<p class="error" id="err" hidden>Usuario o contraseña incorrectos.</p>';
  f.onsubmit = e => {
    e.preventDefault();
    const u = f.querySelector("#u").value.trim().toLowerCase();

    if(u === usuario && c === clave){ alEntrar(); }

  };

  return f;
}

/* ---------- planificación ---------- */
function vistaPlan(p){
  const barra = el("div","barra-hoja");
  const tit = el("div","titulo-hoja");
  tit.append("Planificación de tareas", el("small","","Qué hay que hacer cada día de la fiesta"));
  barra.append(tit);
  const est = el("span","llave" + (editora ? " abierta" : ""), editora ? "Editando como Mary" : "Solo lectura");
  barra.append(est);
  const b = el("button","btn" + (editora ? "" : " btn-oro"), editora ? "Salir" : "Ingresar para editar");
  b.type = "button";
  b.onclick = () => {
    if(editora){ editora = false; pintar(); return; }
    const f = p.querySelector("#acceso");
    f.classList.toggle("abierta");
    if(f.classList.contains("abierta")) f.querySelector("#u").focus();
  };
  barra.append(b);
  p.append(barra);

  panelAcceso(p, "mary", "macmony", () => { editora = true; pintar(); });

  if(!editora){
    const n = el("p","nota","Las tareas se pueden mirar libremente. Para crear o cambiar alguna, entrá con tu usuario.");
    p.append(n);
  }

  const grilla = el("div","dias");
  DIAS.forEach(([clave, rotulo]) => grilla.append(bloqueDia(clave, rotulo)));
  p.append(grilla);

  function bloqueDia(clave, rotulo){
    const d = el("section","dia");
    const hechas = tareas[clave].filter(t=>t.hecha).length;
    const cab = el("header","dia-cab");
    cab.append(el("h3","",rotulo), el("span","cuenta", tareas[clave].length ? hechas+"/"+tareas[clave].length : "sin tareas"));
    d.append(cab);

    const ul = el("ul","tareas");
    if(!tareas[clave].length){
      ul.append(el("li","sin","Todavía no hay tareas para este día."));
    }
    tareas[clave].forEach(t => {
      const li = el("li","tarea" + (t.hecha ? " hecha" : ""));
      const chk = document.createElement("input");
      chk.type = "checkbox"; chk.checked = !!t.hecha; chk.disabled = !editora;
      chk.setAttribute("aria-label","Marcar como hecha: " + t.texto);
      chk.onchange = () => { t.hecha = chk.checked; pintar(); guardarTareas(); };
      li.append(chk);
      const cuerpo = el("div","tarea-cuerpo");
      cuerpo.append(el("span","tarea-txt", t.texto));
      const meta = [t.hora, t.responsable].filter(Boolean).join(" · ");
      if(meta) cuerpo.append(el("span","tarea-meta", meta));
      li.append(cuerpo);
      if(editora){
        const x = el("button","borrar"); x.type="button"; x.innerHTML="&times;";
        x.setAttribute("aria-label","Borrar tarea");
        x.onclick = () => { tareas[clave] = tareas[clave].filter(o=>o!==t); pintar(); guardarTareas(); };
        li.append(x);
      }
      ul.append(li);
    });
    d.append(ul);

    if(editora){
      const f = el("form","nueva");
      f.innerHTML = '<input class="t-txt" placeholder="Nueva tarea" required aria-label="Tarea">'
        + '<input class="t-hora" placeholder="Hora" aria-label="Hora">'
        + '<input class="t-resp" placeholder="Responsable" aria-label="Responsable">'
        + '<button class="btn btn-oro" type="submit">Agregar</button>';
      f.onsubmit = e => {
        e.preventDefault();
        const txt = f.querySelector(".t-txt").value.trim();
        if(!txt) return;
        tareas[clave].push({texto:txt, hora:f.querySelector(".t-hora").value.trim(),
          responsable:f.querySelector(".t-resp").value.trim(), hecha:false});
        pintar(); guardarTareas();
      };
      d.append(f);
    }
    return d;
  }
}

/* ---------- recepción ---------- */
function nombres(){
  const m = new Map();
  datos.forEach(d => {
    if(!m.has(d.nombre)) m.set(d.nombre, {nombre:d.nombre, menores:0, adultos:1, debe:0, devoc:0, listas:new Set()});
    const o = m.get(d.nombre);
    o.menores += (+d.menores||0);
    o.debe += (+d.debe||0);
    o.devoc += 1;
    o.adultos = Math.max(o.adultos, adultos(d));
    o.listas.add(ROTULO[d.lista] || d.lista);
  });
  return [...m.values()].sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
}

function vistaRecepcion(p){
  const gente = nombres();

  const barra = el("div","barra-hoja");
  const tit = el("div","titulo-hoja");
  tit.append("Recepción del evento", el("small","","Marcá a cada devoto cuando llega a la fiesta"));
  barra.append(tit);

  if(!recepcionista){
    const est = el("span","llave","Cerrada");
    barra.append(est);
    const b = el("button","btn btn-oro","Ingresar"); b.type = "button";
    b.onclick = () => {
      const f = p.querySelector("#acceso");
      f.classList.toggle("abierta");
      if(f.classList.contains("abierta")) f.querySelector("#u").focus();
    };
    barra.append(b);
    p.append(barra);
    const f = panelAcceso(p, "sharon", "sharon", () => { recepcionista = true; pintar(); });
    f.classList.add("abierta");
    const av = el("div","aviso-llave");
    av.append(el("b","","La recepción está a cargo de Sharon"),
      document.createTextNode("Entrá con tu usuario para marcar los ingresos del día de la fiesta."));
    p.append(av);
    return;
  }
  const busc = document.createElement("input");
  busc.type = "search"; busc.placeholder = "Buscar devoto…"; busc.value = texto;
  busc.setAttribute("aria-label","Buscar devoto en la recepción");
  busc.oninput = e => { texto = e.target.value; lista(); };
  barra.append(busc);
  const sel = document.createElement("select");
  sel.setAttribute("aria-label","Filtrar por ingreso");
  [["todos","Todos"],["falta","Faltan llegar"],["ok","Ya ingresaron"]].forEach(([v,t])=>{
    const o = document.createElement("option"); o.value=v; o.textContent=t;
    if(estado===v) o.selected = true; sel.append(o);
  });
  sel.onchange = e => { estado = e.target.value; lista(); };
  barra.append(sel);
  const est = el("span","llave abierta","Sharon"); barra.append(est);
  const bSalir = el("button","btn","Salir"); bSalir.type="button";
  bSalir.onclick = () => { recepcionista = false; pintar(); };
  barra.append(bSalir);
  const bReset = el("button","btn","Reiniciar ingresos"); bReset.type="button";
  bReset.onclick = () => {
    if(!confirm("¿Borrar todos los ingresos marcados y empezar de cero?")) return;
    ingresos = {}; pintar(); guardarIngresos();
  };
  barra.append(bReset);
  p.append(barra);

  const marcador = el("div","marcador"); p.append(marcador);
  const caja = el("div"); p.append(caja);
  contar(); lista();

  function contar(){
    const dentro = gente.filter(g => ingresos[g.nombre]);
    const persTot = gente.reduce((a,g)=>a+g.adultos+g.menores,0);
    const persDentro = dentro.reduce((a,g)=>a+g.adultos+g.menores,0);
    const menDentro = dentro.reduce((a,g)=>a+g.menores,0);
    const menTot = gente.reduce((a,g)=>a+g.menores,0);
    const pct = persTot ? Math.round(persDentro/persTot*100) : 0;
    marcador.innerHTML = "";
    const g1 = el("div","cifras");
    const tarj = (v,t,cls) => { const d = el("div","cifra"+(cls?" "+cls:"")); d.append(el("b","",v), el("span","",t)); return d; };
    g1.append(tarj(persDentro,"Personas adentro","ok"),
              tarj(persTot - persDentro,"Faltan entrar","deuda"),
              tarj(dentro.length + " / " + gente.length,"Devotos"),
              tarj(menDentro + " / " + menTot,"Menores"));
    marcador.append(g1);
    const av = el("div","avance");
    const riel = el("div","riel"); const fill = el("div","fill"); fill.style.width = pct+"%";
    riel.append(fill);
    av.append(riel, el("p","", persDentro + " de " + persTot + " personas presentes · " + pct + "% · contando adultos y menores de cada devoción"));
    marcador.append(av);
  }

  function lista(){
    caja.innerHTML = "";
    const t = texto.trim().toLowerCase();
    const filas = gente.filter(g =>
      (!t || g.nombre.toLowerCase().includes(t)) &&
      (estado !== "ok" || ingresos[g.nombre]) &&
      (estado !== "falta" || !ingresos[g.nombre]));
    if(!filas.length){
      const v = el("div","vacio");
      v.append(el("b","","No hay devotos con ese filtro"), document.createTextNode("Probá con otro nombre o cambiá el filtro."));
      caja.append(v); return;
    }
    const tb = el("table","recep-tabla");
    tb.innerHTML = '<thead><tr><th style="text-align:center">Ingreso</th><th>Devoto</th>'
      + (abierto ? '<th>Devoción</th><th style="text-align:center">Menores</th>'
                 + '<th style="text-align:center">Personas</th>' : '')
      + '</tr></thead>';
    const body = el("tbody");
    filas.forEach((g,i)=>{
      const tr = el("tr");
      if(ingresos[g.nombre]) tr.className = "dentro";
      const td = el("td","col-chk");
      const b = el("button"); b.type = "button";
      const marcar = () => {
        b.className = "chk " + (ingresos[g.nombre] ? "si" : "no");
        b.innerHTML = ingresos[g.nombre] ? "&#10003;" : "";
        b.setAttribute("aria-pressed", !!ingresos[g.nombre]);
        b.setAttribute("aria-label", (ingresos[g.nombre] ? "Quitar ingreso de " : "Marcar ingreso de ") + g.nombre);
      };
      marcar();
      b.onclick = () => {
        const entra = !ingresos[g.nombre];
        if(entra) ingresos[g.nombre] = true; else delete ingresos[g.nombre];
        marcar(); tr.classList.toggle("dentro", entra);
        contar(); guardarIngreso(g.nombre, entra);
        if(estado !== "todos") lista();
      };
      td.append(b); tr.append(td);
      const tdN = el("td","nombre celda-nombre"); tdN.append(el("span","",g.nombre));
      if(g.devoc > 1) tdN.append(el("i","estrella chica","★"));
      if(g.debe > 0) tdN.append(el("span","marca debe", plata(g.debe)));
      tr.append(tdN);
      if(g.debe > 0) tr.classList.add("f-debe");
      if(abierto){
        tr.append(el("td","devo", [...g.listas].join(", ")));
        const tdM = el("td","", g.menores || "—");
        tdM.style.textAlign = "center"; tdM.style.fontFamily = '"IBM Plex Mono",monospace';
        tr.append(tdM, el("td","total", g.adultos + g.menores));
        body.append(tr);
        return;
      }
      const mas = el("button","mas"); mas.type="button"; mas.innerHTML="&rsaquo;";
      mas.setAttribute("aria-label","Ver los datos de "+g.nombre);
      tdN.append(mas);
      body.append(tr);
      const det = el("tr","fila-det"); det.hidden = true;
      const tdd = el("td"); tdd.colSpan = 3;
      const ficha = el("div","ficha");
      const rej = el("div","rejilla");
      const bloque = (et, v, cls) => { const c = el("div","campo-f"+(cls?" "+cls:""));
        c.append(el("span","lab-f",et), el("b","valor-f",v)); return c; };
      rej.append(bloque("Devoción", [...g.listas].join(", "), "ancho"),
                 bloque("Adultos", g.adultos),
                 bloque("Menores", g.menores || "—"),
                 bloque("Total personas", g.adultos + g.menores, "fuerte"));
      ficha.append(rej);

      const pendientes = datos.filter(x => x.nombre === g.nombre && (+x.debe > 0 || x.pagado !== "SI"));
      if(pendientes.length){
        const c = el("div","cobrar");
        if(g.debe > 0){
          c.append(el("b","","Cobrar " + plata(g.debe)));
          c.append(el("span","cobrar-txt","Debe en " +
            [...new Set(pendientes.map(x => ROTULO[x.lista] || x.lista))].join(", ") + "."));
        } else {
          c.append(el("b","","Falta pagar"));
          c.append(el("span","cobrar-txt","No tiene monto anotado en la planilla."));
        }
        const bc = el("button","btn-cobrado","Pagó · marcar como cobrado");
        bc.type = "button";
        bc.onclick = () => {
          if(!confirm("¿Confirmás que " + g.nombre + " pagó" +
             (g.debe > 0 ? " " + plata(g.debe) : "") + "?")) return;
          pendientes.forEach(x => { x.debe = 0; x.pagado = "SI"; guardarDev(x); });
          pintar();
        };
        c.append(bc);
        ficha.append(c);
      }

      tdd.append(ficha); det.append(tdd); body.append(det);
      mas.onclick = () => {
        det.hidden = !det.hidden;
        mas.classList.toggle("girado", !det.hidden);
        tr.classList.toggle("abierta", !det.hidden);
      };
    });
    tb.append(body);
    const sc = el("div","scroll"); sc.append(tb); caja.append(sc);
  }
}

/* ---------- render ---------- */
function pintar(){
  pintarHojas();
  const p = $("#panel"); p.innerHTML = "";
  if(hoja === "PLANIFICACION") vistaPlan(p);
  else if(hoja === "RECEPCION") vistaRecepcion(p);
  else if(hoja === "TABLERO") vistaTablero(p);
  else if(hoja === "RESUMEN") vistaResumen(p);
  else vistaLista(p, hoja);
  window.scrollTo({top:0,behavior:"instant"});
}
(async () => { await cargar(); ordenar(); pintar(); })();

/* ---------- portada ---------- */
(() => {
  const tapa = document.getElementById("portada");
  if(!tapa) return;
  let ido = false;
  const salir = () => {
    if(ido) return;
    ido = true;
    tapa.classList.add("fuera");
    setTimeout(() => tapa.remove(), 520);
  };
  tapa.addEventListener("click", salir);
  setTimeout(salir, 1900);
})();
</script>
